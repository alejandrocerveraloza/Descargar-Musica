<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>MusicHub</title>
<link rel="manifest" id="manifest">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{background:#0b0b12;color:#e8e8f0;-webkit-tap-highlight-color:transparent}
  .card{background:linear-gradient(145deg,#171726,#10101b);border:1px solid #23233a;transition:.2s}
  .card:hover{transform:translateY(-3px);border-color:#6d5efc}
  input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:9px;background:#2a2a42;outline:none;width:100%}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#8b7dff;cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#8b7dff;cursor:pointer}
  .spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .btn-primary{background:#6d5efc}.btn-primary:hover{background:#8b7dff}
  .btn-success{background:#059669}.btn-success:hover{background:#10b981}
</style>
</head>
<body class="min-h-screen pb-36">

<header class="max-w-3xl mx-auto px-4 pt-6 pb-2 flex items-center gap-3">
  <button id="back" class="hidden w-10 h-10 rounded-full bg-[#171726] border border-[#23233a] text-xl" aria-label="Volver">←</button>
  <h1 class="text-2xl font-extrabold tracking-tight">Music<span class="text-[#8b7dff]">Hub</span></h1>
</header>

<main class="max-w-3xl mx-auto px-4">
  <!-- HOME -->
  <section id="home">
    <p class="text-slate-400 mb-5">Elige un modo de búsqueda</p>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4" id="cards"></div>
    <p class="text-xs text-slate-500 mt-8 leading-relaxed">
      Fuentes principales: <b>Audius</b> (streaming y descarga cuando el artista lo permite) e <b>iTunes</b> (previews de 30 s).<br>
      Si configuras un backend, también podrás descargar de YouTube.
    </p>
  </section>

  <!-- SEARCH -->
  <section id="search" class="hidden">
    <div class="flex items-center gap-3 mb-1">
      <span id="s-icon" class="text-3xl"></span>
      <h2 id="s-title" class="text-xl font-bold"></h2>
    </div>
    <p id="s-desc" class="text-slate-400 text-sm mb-4"></p>

    <form id="form" class="flex gap-2">
      <input id="q" type="text" autocomplete="off" class="flex-1 min-w-0 rounded-xl bg-[#171726] border border-[#23233a] px-4 py-3 outline-none focus:border-[#6d5efc]" />
      <button class="rounded-xl btn-primary px-5 font-semibold">Buscar</button>
    </form>

    <p id="status" class="text-sm text-slate-400 mt-3 min-h-[1.25rem]"></p>

    <!-- Solo aparece cuando hay backend y se detecta YouTube -->
    <div id="yt-real" class="hidden mt-4 p-4 rounded-xl bg-[#171726] border border-[#6d5efc]/30">
      <div class="font-semibold text-sm mb-1">Descarga real de YouTube disponible</div>
      <p class="text-xs text-slate-400 mb-3" id="yt-real-info"></p>
      <button id="yt-download-btn" class="rounded-lg btn-success px-4 py-2 text-sm font-semibold">⬇ Descargar MP3 de YouTube</button>
    </div>

    <div id="stores" class="hidden mt-3">
      <div class="text-xs text-slate-500 mb-2">Buscar también en:</div>
      <div id="stores-list" class="flex flex-wrap gap-2"></div>
    </div>

    <ul id="results" class="mt-3 space-y-2"></ul>
  </section>
</main>

<!-- PLAYER -->
<div id="player" class="hidden fixed bottom-0 inset-x-0 z-50 bg-[#10101bf2] backdrop-blur border-t border-[#23233a]" style="padding-bottom:env(safe-area-inset-bottom)">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
    <img id="p-art" class="w-12 h-12 rounded-lg object-cover bg-[#23233a]" alt="">
    <div class="flex-1 min-w-0">
      <div id="p-title" class="truncate font-semibold text-sm"></div>
      <div id="p-artist" class="truncate text-xs text-slate-400"></div>
      <div class="flex items-center gap-2 mt-1">
        <span id="p-cur" class="text-[11px] text-slate-400 w-9 tabular-nums">0:00</span>
        <input id="p-seek" type="range" min="0" max="1000" value="0">
        <span id="p-dur" class="text-[11px] text-slate-400 w-9 tabular-nums text-right">0:00</span>
      </div>
    </div>
    <button id="p-play" class="w-12 h-12 shrink-0 rounded-full bg-[#6d5efc] text-xl" aria-label="Play/Pause">▶</button>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN
   ========================================================= */
const BACKEND_URL = ''; // ← Cuando tengas el backend, pon aquí la URL (ej: https://tu-app.onrender.com)
// Deja vacío '' para que funcione solo con Audius + iTunes

const APP = 'MusicHub';

/* ---------- PWA ---------- */
(() => {
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='#0b0b12'/><text x='50' y='66' font-size='56' text-anchor='middle'>🎧</text></svg>`;
  const icon = 'data:image/svg+xml,' + encodeURIComponent(svg);
  const m = { name:'MusicHub', short_name:'MusicHub', display:'standalone', background_color:'#0b0b12', theme_color:'#0b0b12',
    start_url:'.', icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any'}] };
  document.getElementById('manifest').href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type:'application/json'}));
})();

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isUrl = s => /^https?:\/\//i.test(s.trim());
const clean = t => t.replace(/[\(\[](official|lyric|lyrics|audio|video|music video|hd|hq|visualizer)[^\)\]]*[\)\]]/gi,'').replace(/\s+/g,' ').trim();

/* ---------- Modos ---------- */
const MODES = {
  yt: { icon:'▶️', title:'YouTube', desc:'Pega la URL de un vídeo o escribe el nombre de la canción.', ph:'https://youtube.com/watch?v=… o nombre de la canción' },
  sp: { icon:'🟢', title:'Spotify', desc:'Pega un enlace de canción, álbum o playlist de Spotify (o escribe el nombre).', ph:'https://open.spotify.com/track/… o nombre' },
  dj: { icon:'🎚️', title:'DJ Edit / Extended Mixes', desc:'Busca versiones extended, club mixes, intro edits y dubs.', ph:'Artista - Título, o URL' },
  rx: { icon:'🔁', title:'Remix Finder', desc:'Introduce una canción y lista remixes, reworks y bootlegs.', ph:'Artista - Título, o URL' },
};

$('#cards').innerHTML = Object.entries(MODES).map(([k,m]) => `
  <button data-mode="${k}" class="card rounded-2xl p-5 text-left">
    <div class="text-4xl mb-3">${m.icon}</div>
    <div class="font-bold text-lg">${m.title}</div>
    <div class="text-sm text-slate-400 mt-1">${m.desc.split('.')[0]}.</div>
  </button>`).join('');

let mode = null;
let currentYtUrl = null; // para la descarga real

function show(view){
  $('#home').classList.toggle('hidden', view!=='home');
  $('#search').classList.toggle('hidden', view!=='search');
  $('#back').classList.toggle('hidden', view==='home');
}

$('#cards').addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if(!b) return;
  mode = b.dataset.mode;
  const m = MODES[mode];
  $('#s-icon').textContent = m.icon;
  $('#s-title').textContent = m.title;
  $('#s-desc').textContent = m.desc;
  $('#q').placeholder = m.ph;
  $('#q').value = '';
  $('#results').innerHTML = '';
  $('#status').textContent = '';
  $('#stores').classList.add('hidden');
  $('#yt-real').classList.add('hidden');
  currentYtUrl = null;
  show('search');
  $('#q').focus();
});

$('#back').onclick = () => show('home');

/* ---------- Resolver URL → texto ---------- */
async function resolveQuery(input){
  input = input.trim();
  if(!isUrl(input)) return { text: input, note:'', isYt:false, isSp:false };

  let api, isYt = false, isSp = false;
  if(/youtu\.?be/i.test(input)){ api = 'https://noembed.com/embed?url=' + encodeURIComponent(input); isYt = true; }
  else if(/spotify\.com/i.test(input)){ api = 'https://open.spotify.com/oembed?url=' + encodeURIComponent(input); isSp = true; }
  else throw new Error('Solo se admiten enlaces de YouTube o Spotify.');

  try{
    const r = await fetch(api);
    const j = await r.json();
    if(!j.title) throw 0;
    let t = clean(j.title);
    if(j.author_name && isYt && !t.toLowerCase().includes(j.author_name.toLowerCase().replace(/ - topic$/i,''))) {
      t = `${j.author_name.replace(/ - Topic$/i,'')} ${t}`;
    }
    const isList = /[?&]list=|\/playlist\/|\/album\//i.test(input);
    return {
      text: t,
      note: isList ? `Lista/álbum detectado ("${j.title}"). Se busca por título.` : `Detectado: "${j.title}"`,
      isYt, isSp, originalUrl: input
    };
  }catch{
    throw new Error('No se pudo leer el enlace. Escribe el nombre de la canción manualmente.');
  }
}

/* ---------- Fuentes legales ---------- */
let audiusHost = null;
async function getHost(){
  if(audiusHost) return audiusHost;
  const r = await fetch('https://api.audius.co');
  const j = await r.json();
  audiusHost = j.data[Math.floor(Math.random()*j.data.length)];
  return audiusHost;
}

async function srcItunes(q){
  const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=song&limit=25`);
  const j = await r.json();
  return (j.results||[]).filter(x=>x.previewUrl).map(x => ({
    id:'it'+x.trackId, source:'iTunes', title:x.trackName, artist:x.artistName,
    art:(x.artworkUrl100||'').replace('100x100','300x300'), audio:x.previewUrl, preview:true,
    dur:30, link:x.trackViewUrl, downloadable:false
  }));
}

async function srcAudius(q){
  const h = await getHost();
  const r = await fetch(`${h}/v1/tracks/search?query=${encodeURIComponent(q)}&limit=25&app_name=${APP}`);
  const j = await r.json();
  return (j.data||[]).map(x => ({
    id:'au'+x.id, source:'Audius', title:x.title, artist:x.user?.name||'',
    art:x.artwork?.['150x150']||x.artwork?.['480x480']||'', 
    audio:`${h}/v1/tracks/${x.id}/stream?app_name=${APP}`,
    preview:false, dur:x.duration, link:'https://audius.co'+(x.permalink||''),
    downloadable: x.is_downloadable === true || x.download?.is_downloadable === true
  }));
}

async function searchAll(qs){
  const jobs = qs.flatMap(q => [srcItunes(q), srcAudius(q)]);
  const res = await Promise.allSettled(jobs);
  const seen = new Set(), out = [];
  res.forEach(r => {
    if(r.status==='fulfilled') r.value.forEach(t => {
      if(!seen.has(t.id)){ seen.add(t.id); out.push(t); }
    });
  });
  return out;
}

const RX_DJ = /extended|club mix|intro|edit|dub|radio mix|original mix|remix|\bmix\b/i;
const RX_REMIX = /remix|rework|bootleg|flip|\bvip\b|re-?edit|refix|mashup/i;

/* ---------- Búsqueda principal ---------- */
let items = [];

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const raw = $('#q').value.trim();
  if(!raw) return;

  const st = $('#status');
  const ul = $('#results');
  ul.innerHTML = '';
  $('#yt-real').classList.add('hidden');
  currentYtUrl = null;
  st.innerHTML = '<span class="inline-block spin mr-1">⟳</span> Buscando…';

  try{
    const resolved = await resolveQuery(raw);
    let qs = [resolved.text];
    let filter = null;

    if(mode==='dj'){ qs = [resolved.text+' extended mix', resolved.text+' club mix', resolved.text+' edit']; filter = t => RX_DJ.test(t.title); }
    if(mode==='rx'){ qs = [resolved.text+' remix', resolved.text]; filter = t => RX_REMIX.test(t.title); }

    // Si es YouTube + tenemos backend → mostrar opción de descarga real
    if(resolved.isYt && BACKEND_URL){
      currentYtUrl = resolved.originalUrl;
      $('#yt-real-info').textContent = resolved.note || resolved.text;
      $('#yt-real').classList.remove('hidden');
    }

    let r = await searchAll(qs);
    if(filter) r = r.filter(filter);
    items = r;

    renderStores(resolved.text);
    st.textContent = (resolved.note ? resolved.note + ' · ' : '') + (r.length ? `${r.length} resultados` : 'Sin resultados. Prueba con otro nombre.');
    render();
  }catch(err){
    st.textContent = err.message || 'Error al buscar.';
  }
});

/* ---------- Descarga real de YouTube (backend) ---------- */
$('#yt-download-btn').addEventListener('click', async () => {
  if(!currentYtUrl || !BACKEND_URL) return;
  const btn = $('#yt-download-btn');
  const old = btn.textContent;
  btn.textContent = '⟳ Descargando…';
  btn.disabled = true;

  try{
    // Primero intentamos obtener el nombre
    let filename = 'youtube-audio.mp3';
    try{
      const infoRes = await fetch(`${BACKEND_URL}/api/info?url=${encodeURIComponent(currentYtUrl)}`);
      if(infoRes.ok){
        const info = await infoRes.json();
        filename = `${info.artist || 'Unknown'} - ${info.title || 'audio'}`.replace(/[\\/:*?"<>|]/g,'_') + '.mp3';
      }
    }catch{}

    // Forzamos la descarga
    const a = document.createElement('a');
    a.href = `${BACKEND_URL}/api/download?url=${encodeURIComponent(currentYtUrl)}`;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(err){
    alert('Error al descargar. ¿Está el backend funcionando?');
  }finally{
    btn.textContent = old;
    btn.disabled = false;
  }
});

/* ---------- Tiendas externas ---------- */
function renderStores(text){
  const sfx = mode==='dj' ? ' extended mix' : mode==='rx' ? ' remix' : '';
  const q = encodeURIComponent(text + sfx);
  const links = [
    ['Beatport',   `https://www.beatport.com/search?q=${q}`],
    ['Traxsource', `https://www.traxsource.com/search?term=${q}`],
    ['Bandcamp',   `https://bandcamp.com/search?q=${q}`],
    ['SoundCloud', `https://soundcloud.com/search?q=${q}`],
    ['YouTube',    `https://www.youtube.com/results?search_query=${q}`],
  ];
  $('#stores-list').innerHTML = links.map(([n,u]) =>
    `<a href="${u}" target="_blank" rel="noopener" class="rounded-lg bg-[#171726] border border-[#23233a] hover:border-[#6d5efc] px-3 py-2 text-sm">${n} ↗</a>`
  ).join('');
  $('#stores').classList.toggle('hidden', !(mode==='dj' || mode==='rx'));
}

/* ---------- Render resultados ---------- */
function render(){
  $('#results').innerHTML = items.map((t,i) => `
    <li class="card rounded-xl p-3 flex items-center gap-3" style="transform:none">
      <button data-play="${i}" class="relative shrink-0 w-14 h-14 rounded-lg overflow-hidden bg-[#23233a]" aria-label="Previsualizar">
        ${t.art ? `<img src="${esc(t.art)}" class="w-full h-full object-cover" loading="lazy" alt="">` : ''}
        <span class="absolute inset-0 grid place-items-center bg-black/40 text-lg">▶</span>
      </button>
      <div class="flex-1 min-w-0">
        <div class="truncate font-semibold text-sm">${esc(t.title)}</div>
        <div class="truncate text-xs text-slate-400">${esc(t.artist)}</div>
        <div class="text-[10px] mt-1">
          <span class="px-1.5 py-0.5 rounded bg-[#23233a] text-slate-300">${t.source}</span>
          ${t.preview ? '<span class="ml-1 text-amber-400">preview 30s</span>' : '<span class="ml-1 text-emerald-400">completo</span>'}
        </div>
      </div>
      ${t.downloadable
        ? `<button data-dl="${i}" class="shrink-0 rounded-lg btn-success px-3 py-2 text-sm font-semibold">⬇ Descargar</button>`
        : `<a href="${esc(t.link)}" target="_blank" rel="noopener" class="shrink-0 rounded-lg bg-[#23233a] hover:bg-[#2e2e4a] px-3 py-2 text-sm">${t.source==='iTunes'?'Comprar':'Ver'} ↗</a>`
      }
    </li>`).join('');
}

$('#results').addEventListener('click', e => {
  const p = e.target.closest('[data-play]'); if(p) return play(items[+p.dataset.play]);
  const d = e.target.closest('[data-dl]'); if(d) return download(items[+d.dataset.dl], d);
});

/* ---------- Descarga Audius ---------- */
async function download(t, btn){
  const name = `${t.artist} - ${t.title}`.replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_') + '.mp3';
  const old = btn.textContent;
  btn.textContent = '⟳ …';
  btn.disabled = true;
  try{
    const r = await fetch(t.audio);
    if(!r.ok) throw 0;
    const url = URL.createObjectURL(await r.blob());
    const a = Object.assign(document.createElement('a'), { href:url, download:name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch{
    window.open(t.link, '_blank');
  }finally{
    btn.textContent = old;
    btn.disabled = false;
  }
}

/* ---------- Reproductor ---------- */
const audio = new Audio();
audio.preload = 'metadata';
const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}` : '0:00';

function play(t){
  if(audio.dataset.id === t.id){
    audio.paused ? audio.play() : audio.pause();
    return;
  }
  audio.src = t.audio;
  audio.dataset.id = t.id;
  audio.play().catch(()=>{});
  $('#player').classList.remove('hidden');
  $('#p-art').src = t.art || '';
  $('#p-title').textContent = t.title;
  $('#p-artist').textContent = `${t.artist} · ${t.source}`;
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title,
      artist: t.artist,
      artwork: t.art ? [{src: t.art}] : []
    });
  }
}

$('#p-play').onclick = () => audio.paused ? audio.play() : audio.pause();
audio.onplay  = () => $('#p-play').textContent = '⏸';
audio.onpause = () => $('#p-play').textContent = '▶';
audio.onloadedmetadata = () => $('#p-dur').textContent = fmt(audio.duration);

let seeking = false;
audio.ontimeupdate = () => {
  $('#p-cur').textContent = fmt(audio.currentTime);
  if(!seeking && audio.duration) $('#p-seek').value = audio.currentTime / audio.duration * 1000;
};
$('#p-seek').addEventListener('input', e => {
  seeking = true;
  if(audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration;
});
$('#p-seek').addEventListener('change', () => seeking = false);
</script>
</body>
</html>
